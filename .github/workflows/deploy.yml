name: Deploy StoryPlay and redesign preview

on:
  push:
    branches: ["main", "redesign/dual-editor"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout redesign preview
        uses: actions/checkout@v4
        with:
          ref: redesign/dual-editor
          path: redesign

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build existing production site
        working-directory: production
        run: |
          npm ci
          npm run build

      - name: Build isolated redesign preview
        working-directory: redesign
        env:
          VITE_STORYPLAY_PREVIEW: "true"
        run: |
          npm ci
          npm run build -- --base=/StoryPlay/preview/

      - name: Add preview under separate URL
        run: |
          mkdir -p production/dist/preview
          cp -R redesign/dist/. production/dist/preview/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload both sites
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./production/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
